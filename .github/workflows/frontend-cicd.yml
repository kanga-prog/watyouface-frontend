name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE: https://api.watyouface.com
      VITE_WS_URL: https://api.watyouface.com/ws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy dist to Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/hostinger_deploy -p ${PORT}" \
            dist/ \
            "${USER}@${HOST}:${REMOTE_PATH}/"

      - name: Production smoke test
        run: |
          curl --fail --silent --show-error --location https://watyouface.com/ > /dev/null
          curl --fail --silent --show-error --location https://watyouface.com/chat > /dev/null
